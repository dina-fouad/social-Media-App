}

.loader {
  width: 60px;
  height: 60px;

  border-top: 6px solid #00ffcc;

}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes glow {

  100% { box-shadow: 0 0 30px #00ffcc; }
}

function toggleEmojiBox() {

function openUpdateModal(button) {
    // استرجاع بيانات `post` من `data-post`
    let post = JSON.parse(button.getAttribute("data-post"));

    // تعبئة الحقول في النافذة المنبثقة

    document.getElementById("postBodyUpdate").value = post.body;

}

         
function goToProfile() {
    let user = JSON.parse(localStorage.getItem("user"));

    }
}

  ].join('')
