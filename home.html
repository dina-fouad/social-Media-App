/* تأكد من أن الـ loader في وسط الصفحة */
.loader-container {
  display: flex;
  justify-content: center;
  align-items: center;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%); /* لجعلها في المنتصف تمامًا */
  background: rgba(0, 0, 0, 0.7); /* لون داكن شفاف */
  padding: 20px;
  border-radius: 50%; /* يجعل الخلفية دائرية حول اللودر */
  z-index: 9999;
}


.loader {
  width: 60px;
  height: 60px;
  border: 6px solid transparent;
  border-top: 6px solid #00ffcc;
  border-radius: 50%;
  animation: spin 1s linear infinite, glow 1.5s ease-in-out infinite alternate;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes glow {
  0% { box-shadow: 0 0 10px #00ffcc; }
  100% { box-shadow: 0 0 30px #00ffcc; }
}

@media (max-width: 768px) { /* عند عرض الشاشة أقل من 768px */
    .loader-container {
        padding: 15px; /* تقليل المساحة حول اللودر */
    }
    .loader {
        width: 50px; /* تقليل حجم اللودر */
        height: 50px;
        border-width: 5px;
    }
}

// login
function loginBtn(){
    let userName = document.getElementById("userName").value;
    let passWord = document.getElementById("Password").value;
    
    axios.post('https://tarmeezacademy.com/api/v1/login', {
        "username": userName,
        "password": passWord
    })
    .then(function (response) {
     console.log(response.data);
        let token = response.data.token;
        localStorage.setItem("name", token);
        localStorage.setItem("user", JSON.stringify(response.data.user));

        let modal = document.getElementById("exampleModal");
        let modalInstance = bootstrap.Modal.getInstance(modal);
        modalInstance.hide();
        showAlert('Nice, You have successfully logged in!','success'); 
       
        hideBtns(); 
    })
    .catch(function (error) {
        let err = error.response.data.message 
        
        showAlert(err, 'danger');
    });
}

});

function hideBtns() {

    let loginBtn = document.getElementById("loginBtnH");
    let logoutBtn = document.getElementById("logout");
    let addPost = document.getElementById("addPost");
  
   

    let token = localStorage.getItem("name");

    if (token == null) {
     
        registerBtn.style.display = "inline-block";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        addPost.style.visibility = "hidden";

    }
   
}
